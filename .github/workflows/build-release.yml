# SPDX-License-Identifier: AGPL-3.0-only
name: Build and release

on:
  push:
    branches: [main, ui-redesign]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Create a GitHub release with this tag (e.g. v0.2.0). Leave empty to only build."
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out the version
        id: ver
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$TAG" ] && [ "${{ github.ref_type }}" = "tag" ]; then TAG="${{ github.ref_name }}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ -n "$TAG" ]; then echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"; else echo "name=0.1.0-dev+${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"; fi

      - name: Decode signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "No KEYSTORE_BASE64 secret: the release APK will use the debug key."
          fi

      - name: Build debug and release APKs
        env:
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/crystal-alarm-debug.apk
          cp app/build/outputs/apk/release/*.apk dist/crystal-alarm-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: crystal-alarm-apks
          path: dist/*.apk

      - name: Publish GitHub release
        if: steps.ver.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk --clobber
          else
            gh release create "$TAG" dist/*.apk --title "Crystal Alarm $TAG" --generate-notes --target "${{ github.sha }}"
          fi
